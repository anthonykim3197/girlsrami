<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow,noimageindex">
  <title>페이지를 찾을 수 없어요 | 걸스라미</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    body{min-height:100svh;display:flex;flex-direction:column;background:#fbfaf7;color:#252720}
    .missing-header{border-bottom:1px solid #deded5}
    .missing-header .wrap{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .missing-brand{font-weight:700;letter-spacing:.13em;font-size:19px}
    .missing-nav{font-size:14px;color:#62675c;text-underline-offset:5px}
    .missing-nav:hover{text-decoration:underline}
    .missing-main{width:100%;flex:1;display:grid;align-content:center;padding-top:96px;padding-bottom:112px}
    .missing-code{font-size:13px;letter-spacing:.22em;color:#777d70;margin-bottom:26px}
    .missing-main h1{font-size:clamp(28px,5vw,46px);font-weight:700;line-height:1.35;letter-spacing:-.04em;margin-bottom:22px}
    .missing-main p{max-width:520px;color:#6d7065;line-height:1.9;font-size:16px}
    .missing-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
    .missing-actions a{display:inline-flex;align-items:center;justify-content:center;gap:18px;min-height:52px;padding:14px 24px;border:1px solid #252720;font-weight:700}
    .missing-actions a:first-child{color:#fff;background:#252720}
    .missing-actions svg{width:18px;height:18px;flex:none}
    a:focus-visible{outline:2px solid #606b50;outline-offset:5px}
    .missing-footer{padding:24px 0;border-top:1px solid #deded5;color:#777d70;font-size:12px;letter-spacing:.04em}
    @media(max-width:480px){.missing-header .wrap{min-height:64px}.missing-brand{font-size:16px}.missing-nav{font-size:13px}.missing-main{padding-top:72px;padding-bottom:88px}.missing-actions{flex-direction:column}.missing-actions a{width:100%}}
  </style>
</head>
<body>
  <header class="missing-header">
    <div class="wrap">
      <a class="missing-brand" href="/" aria-label="걸스라미 홈">GIRLSRAMI</a>
      <a class="missing-nav" href="/shop">판매 상품</a>
    </div>
  </header>
  <main class="wrap missing-main">
    <div class="missing-code">404 / PAGE NOT FOUND</div>
    <h1>페이지를 찾을 수 없어요.</h1>
    <p>주소가 바뀌었거나 공개가 종료된 페이지입니다.<br>지금 판매 중인 상품은 아래에서 만나보세요.</p>
    <div class="missing-actions">
      <a href="/shop">판매 상품 보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
      <a href="/">홈으로 가기</a>
    </div>
  </main>
  <footer class="missing-footer"><div class="wrap">GIRLSRAMI · 국내에서 직접 만드는 여성 니트</div></footer>
</body>
</html>
